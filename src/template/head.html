<script>/* live site only: show the page in the browser's language (Spanish, or English for anything else); a choice made with the switch always wins */
(function(){try{var h=location.hostname;if(!/(^|\.)miguel-adan\.com$|\.pages\.dev$/.test(h))return;var saved=localStorage.getItem('ma-lang');var page=document.documentElement.getAttribute('data-page-lang')||'en';var want=saved||((navigator.language||'en').toLowerCase().indexOf('es')===0?'es':'en');if(page==='en'&&want==='es')location.replace('/es/'+location.search+location.hash)}catch(e){}})();</script>
